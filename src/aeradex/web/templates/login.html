<!doctype html>
<html lang="de-CH" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anmelden · {{ firma }}</title>
<link rel="icon" href="/static/logo.svg?v={{ asset }}" type="image/svg+xml">
<link rel="stylesheet" href="/static/aeradex.css?v={{ asset }}">
<style>
  .loginwrap { min-height: 100%; display: grid; place-items: center; padding-inline: 16px; padding-block: 40px; }
  .loginbox { width: min(380px, 100%); display: flex; flex-direction: column; gap: 18px; }
  .loginbox .panel { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
</style>
</head>
<body>
<div class="loginwrap">
  <div class="loginbox">
    <div class="brand"><span class="coin" aria-hidden="true"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><mask id="ae-login"><rect width="32" height="32" fill="#fff"/><g fill="none" stroke="#000" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15.85 11.4V20.6"/><circle cx="11.25" cy="16" r="4.6"/><path d="M15.85 16H25.35A4.75 4.75 0 0 0 15.85 16"/><path d="M15.85 16A4.75 4.75 0 0 0 24.24 19.05"/></g></mask><circle cx="16" cy="16" r="15" fill="currentColor" mask="url(#ae-login)"/></svg></span><b>aeradex</b></div>
    <form class="panel" method="post" action="/login?weiter={{ weiter|urlq }}">
      <div><h1 style="font-size:20px;margin:0">{{ firma }}</h1><p class="small muted">Anmelden, um die Buchhaltung zu öffnen.</p></div>
      {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
      <div class="field"><label for="n">Benutzername</label><input class="input" id="n" name="name" autocomplete="username" required autofocus></div>
      <div class="field"><label for="p">Passwort</label><input class="input" id="p" name="passwort" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" type="submit" style="justify-content:center">Anmelden</button>
    </form>
  </div>
</div>
</body>
</html>
