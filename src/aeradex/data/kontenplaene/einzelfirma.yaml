# Kontenrahmen KMU (Schweiz) für die Einzelfirma (Einzelunternehmen, Art. 945 OR).
# Gleich wie die Vorlage für GmbH und AG, aber mit dem Eigenkapital des Inhabers statt Stamm-/Aktienkapital
# und Reserven: Es gibt keine Gewinnverwendung und keine Dividende. Das Jahresergebnis geht bei der Eröffnung
# des Folgejahres ins Eigenkapital (2800), ebenso die Privatkonten (abschluss: "2800").
# Was der Inhaber für sich bezieht oder privat bezahlt, geht über die Privatkonten, nicht über den Aufwand:
#   2850 Privat                        Privatbezüge, private Rechnungen ab Geschäftskonto, Einlagen (Haben)
#   2851 Privat AHV/IV/EO              persönliche Beiträge des Inhabers als Selbständigerwerbender
#                                      (Akonto- und Schlussrechnungen der Ausgleichskasse)
#   2852 Privat Steuern                Einkommens- und Vermögenssteuern des Inhabers (die Einzelfirma
#                                      selbst ist nicht steuerpflichtig, darum kein Konto Direkte Steuern)
# Privatanteile an Geschäftsaufwand (Fahrzeug, Telefon, Naturalbezüge) mindern den Aufwand: Privat an 6270 usw.
# Eröffnungssalden (eroeffnung) sind vorzeichenbehaftet: Aktiven +, Passiven −.
systemkonten:
  gewinnvortrag: "2800"   # das Jahresergebnis geht ins Eigenkapital
konten:
