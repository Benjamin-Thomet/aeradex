# Kontenplan für Schweizer Vereine (Art. 60 ff. ZGB), angelehnt an den KMU-Kontenrahmen,
# damit Lohn, MWST, Kreditoren und Fremdwährungen von batzen ohne Anpassung funktionieren.
# Vereine ohne Handelsregistereintrag führen eine «Milchbüchlein»-Buchhaltung (Art. 957 Abs. 2 OR);
# dieser Plan genügt auch der vollen Buchführungspflicht.
# Das Eigenkapital heisst Vereinsvermögen; zweckgebundene Fonds stehen separat (2850).
# Eröffnungssalden (eroeffnung) sind vorzeichenbehaftet: Aktiven +, Passiven −.
systemkonten:
  ertrag: "3000"          # Rechnungen gehen standardmässig auf Mitgliederbeiträge
  gutschrift: "3000"
  reserve: "2850"
konten:
# --- 1 Aktiven ---
- {nr: "1000", name: Kasse, klasse: aktiv}
- {nr: "1010", name: Postkonto, klasse: aktiv}
- {nr: "1020", name: Bank, klasse: aktiv}
- {nr: "1060", name: Wertschriften, klasse: aktiv}
- {nr: "1100", name: Forderungen (ausstehende Mitgliederbeiträge und Rechnungen), klasse: aktiv}
- {nr: "1170", name: Vorsteuer MWST Material und Dienstleistungen, klasse: aktiv}
- {nr: "1171", name: Vorsteuer MWST Investitionen und übriger Betriebsaufwand, klasse: aktiv}
- {nr: "1176", name: Verrechnungssteuer, klasse: aktiv}
- {nr: "1200", name: Vorräte (Festwirtschaft, Verkaufsartikel), klasse: aktiv}
- {nr: "1300", name: Aktive Rechnungsabgrenzung, klasse: aktiv}
- {nr: "1500", name: Mobiliar und Vereinsmaterial, klasse: aktiv}
- {nr: "1520", name: Informatik, klasse: aktiv}
# --- 2 Passiven ---
- {nr: "2000", name: Verbindlichkeiten aus Lieferungen und Leistungen (Kreditoren), klasse: passiv}
- {nr: "2030", name: Erhaltene Anzahlungen, klasse: passiv}
- {nr: "2200", name: Geschuldete MWST (Umsatzsteuer), klasse: passiv}
- {nr: "2201", name: Abrechnungskonto MWST, klasse: passiv}
- {nr: "2270", name: Verbindlichkeiten Ausgleichskasse (AHV/IV/EO/ALV/FAK), klasse: passiv}
- {nr: "2271", name: Verbindlichkeiten Unfall- und Krankentaggeldversicherung, klasse: passiv}
- {nr: "2272", name: Verbindlichkeiten Vorsorgeeinrichtung (BVG), klasse: passiv}
- {nr: "2279", name: Verbindlichkeiten Quellensteuer, klasse: passiv}
