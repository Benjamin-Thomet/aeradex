[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeradex-leistungen"
version = "0.1.0"
description = "Offerten, Zeiterfassung, Produkte, Projekte und Abrechnung an Kunden — Plugin für aeradex"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["aeradex>=0.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."aeradex.plugins"]
leistungen = "aeradex_leistungen"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeradex_leistungen = ["templates/*.html", "templates/leistungen/*.html", "data/*.json"]
