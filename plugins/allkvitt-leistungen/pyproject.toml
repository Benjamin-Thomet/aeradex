[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allkvitt-leistungen"
version = "0.1.0"
description = "Offerten, Zeiterfassung, Produkte, Projekte und Abrechnung an Kunden — Plugin für allkvitt"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["allkvitt>=0.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."allkvitt.plugins"]
leistungen = "allkvitt_leistungen"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
allkvitt_leistungen = ["templates/*.html"]
