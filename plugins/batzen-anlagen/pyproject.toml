[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batzen-anlagen"
version = "0.1.0"
description = "Anlagenbuchhaltung mit Abschreibungen und Anlagenspiegel — Plugin für batzen"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["batzen>=0.8"]

[project.entry-points."batzen.plugins"]
anlagen = "batzen_anlagen"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
batzen_anlagen = ["templates/*.html"]
