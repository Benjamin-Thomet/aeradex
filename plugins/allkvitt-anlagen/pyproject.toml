[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allkvitt-anlagen"
version = "0.1.0"
description = "Anlagenbuchhaltung mit Abschreibungen und Anlagenspiegel — Plugin für allkvitt"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["allkvitt>=0.8"]

[project.entry-points."allkvitt.plugins"]
anlagen = "allkvitt_anlagen"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
allkvitt_anlagen = ["templates/*.html"]
