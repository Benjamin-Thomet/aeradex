# /etc/fail2ban/filter.d/aeradex-team-portal.conf — login, activation and sync token of the Team-App
[Definition]
failregex = ^.*aeradex_team_portal WARNING (?:login|activation) failed user=\S* ip=<HOST>\s*$
            ^.*aeradex_team_portal WARNING sync auth failed ip=<HOST>\s*$
journalmatch = _SYSTEMD_UNIT=aeradex-team-portal.service
