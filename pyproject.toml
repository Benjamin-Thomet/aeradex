[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeradex"
version = "0.8.0"
description = "Swiss bookkeeping your agent can run — agent-first open-source accounting and payroll for Switzerland."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Benjamin Thomet" }]
keywords = ["accounting", "buchhaltung", "payroll", "lohn", "switzerland", "qr-bill", "agent", "mcp", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Natural Language :: German",
]
dependencies = [
    "PyYAML>=6.0",
    "reportlab>=4.0",
    "qrbill>=1.2",
    "svglib>=1.5",
    "pypdf>=4.0",
    "pluggy>=1.3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
ui = ["starlette>=0.40", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "watchfiles>=0.21", "anthropic>=1.0"]
scan = ["zxing-cpp>=2.2", "pypdfium2>=4.0", "pillow>=10"]
crypt = ["cryptography>=42"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8", "lxml>=5"]

[project.urls]
Homepage = "https://aeradex.ch"
Repository = "https://github.com/Benjamin-Thomet/aeradex"
Issues = "https://github.com/Benjamin-Thomet/aeradex/issues"
Documentation = "https://github.com/Benjamin-Thomet/aeradex#readme"
Changelog = "https://github.com/Benjamin-Thomet/aeradex/commits/main"

[project.scripts]
aeradex = "aeradex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeradex = ["data/**/*", "web/templates/*", "web/static/*", "web/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
